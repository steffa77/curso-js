<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
  <script>
    //JSON = Javascript Object notation
    //Sirve como interfaz de comunicación entre sistemas heterogéneos
    const fichaPersonal = {
      apellidos: "Garay Mendoza",
      nombres: "Steffano",
      telefonos: ["999888777"],
      locacion: {
        departamento: "Ica",
        provincia: "Chincha",
        distrito: "El Carmen",
        direccion: "Calle Miraflores",
        referencia: null
      }
    }


    //Crear JSON (cadena simple) = Es un string que recibimos de otro servidor
    const jsonBasico = `{"carrera": "Ingenieria de Software", "ciclo": "IV", "curso": "Seminario I"}`
    //Convertir OBJECT > JSON (cadena de caracteres)
    console.log(JSON.stringify(fichaPersonal))

    //Mostrar el jsonBasico
    console.log(jsonBasico)

    //JSON > OBJECT
    console.log(JSON.parse(jsonBasico))

  </script>
</body>
</html>
